name: ♻ backend

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: The label of the runner (GitHub- or self-hosted) to run this workflow on. Defaults to `ubuntu-24.04`.
        type: string
        required: false
        default: ubuntu-24.04

      environment:
        description: The name of the GitHub environment that this workflow should use for deployments.
        type: string
        required: true

      terraform_version:
        description: The version of Terraform to install.
        type: string
        required: false
        default: latest

      working_directory:
        description: The working directory to run the Terraform commands in.
        type: string
        required: false
        default: "."

      backend_config:
        description: The path, relative to the working directory, of a configuration file (`.tfbackend`) containing the remaining arguments for a partial backend configuration.
        type: string
        required: false
        default: "/backend-configs"

      run_terraform_plan:
        description: Run `terraform plan`? Defaults to `false` if the workflow was triggered by Dependabot, else `true`.
        type: boolean
        required: false
        default: ${{ github.actor != 'dependabot[bot]' }}

      run_terraform_apply:
        description: Run `terraform apply` for the saved plan file?
        type: boolean
        required: false
        default: true

    secrets:
      AZURE_CLIENT_ID:
        description: The client ID of the service principal to use for authenticating to Azure.
        required: false

      AZURE_SUBSCRIPTION_ID:
        description: The ID of the Azure subscription to authenticate to.
        required: false

      AZURE_TENANT_ID:
        description: The ID of the Microsoft Entra tenant to authenticate to.
        required: false
jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Plan
      runs-on: ${{ inputs.runs_on }}
      environment:
        name: ${{ case(inputs.run_terraform_plan, inputs.environment, '') }}
        deployment: false
      permissions:
        contents: read # Required to checkout the repository
        id-token: write # Required to authenticate to Azure with OIDC
      defaults:
        run:
          shell: bash
          working-directory: ${{ inputs.working_directory }}
      env:
        # The SSH_PRIVATE_KEY secret must be set as a job-level environment variable before it can be used in an "if:" conditional.
        # Ref: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets#using-secrets-in-a-workflow
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false


    - name: Run Terraform Init
      id: init
      env:
        RUN_TERRAFORM_PLAN: ${{ inputs.run_terraform_plan }}
        BACKEND_CONFIG: ${{ inputs.backend_config }}
      run: |
        optional_args=()
        if [[ "$RUN_TERRAFORM_PLAN" == "false" ]]; then
          optional_args+=(-backend=false)
        elif [[ -n "$BACKEND_CONFIG" ]]; then
          optional_args+=(-backend-config="$BACKEND_CONFIG")
        fi
        terraform init -input=false "${optional_args[@]}"
        
    outputs:
      upload-outcome: ${{ steps.upload.outcome }}

    - name: Terraform Apply
    needs: terraform-plan
    if: needs.terraform-plan.outputs.upload-outcome == 'success' && inputs.run_terraform_apply
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # Required to checkout the repository
      id-token: write # Required to authenticate to Azure with OIDC
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false